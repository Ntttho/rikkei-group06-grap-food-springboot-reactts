name: Submodule CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Build & Test (Java 21 Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests
        working-directory: ./grab-food-springboot
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

  frontend-build:
    name: Frontend Build & Type Check (React 19 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./client/fe-flash-food/package-lock.json

      - name: Install Dependencies
        working-directory: ./client/fe-flash-food
        run: npm ci

      - name: TypeScript Check & Vite Build
        working-directory: ./client/fe-flash-food
        run: npm run build
