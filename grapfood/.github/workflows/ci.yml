name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-ci:
    name: Backend Build & Test (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit & Integration Tests
        working-directory: ./shoopeFood-clone-main/grab-food-springboot
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

      - name: Build Production JAR
        working-directory: ./shoopeFood-clone-main/grab-food-springboot
        run: |
          ./mvnw package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./shoopeFood-clone-main/grab-food-springboot/target/*.jar
          retention-days: 7

  frontend-ci:
    name: Frontend Build & Type Check (React 19 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./shoopeFood-clone-main/client/fe-flash-food/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./shoopeFood-clone-main/client/fe-flash-food
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        working-directory: ./shoopeFood-clone-main/client/fe-flash-food
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./shoopeFood-clone-main/client/fe-flash-food/dist
          retention-days: 7

  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images
        run: |
          docker compose build --parallel
